<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%" role="img" aria-label="Adrian Williams — Identity &amp; Access · AI builder · Tallahassee, FL">
  <defs>
    <!-- Rust to Espresso primary gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A4502F" />
      <stop offset="52%" stop-color="#5E3122" />
      <stop offset="100%" stop-color="#2B211C" />
    </linearGradient>

    <!-- Subtle warm editorial ambient glow -->
    <radialGradient id="warm-glow" cx="15%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#D47A53" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#A4502F" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#2B211C" stop-opacity="0" />
    </radialGradient>

    <!-- Secondary deep vignette glow -->
    <radialGradient id="corner-shadow" cx="92%" cy="88%" r="65%">
      <stop offset="0%" stop-color="#18120F" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#2B211C" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle outer border gradient for light & dark mode crispness -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8B89A" stop-opacity="0.38" />
      <stop offset="50%" stop-color="#C89D7C" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#8C6D58" stop-opacity="0.32" />
    </linearGradient>

    <!-- Editorial rule gradient -->
    <linearGradient id="rule-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6C3AD" stop-opacity="0.65" />
      <stop offset="70%" stop-color="#C89D7C" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#C89D7C" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle architectural grid pattern -->
    <pattern id="editorial-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#F5EFE6" stroke-width="0.6" stroke-opacity="0.045" />
    </pattern>

    <clipPath id="card-clip">
      <rect x="2" y="2" width="1196" height="316" rx="14" ry="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Base gradient -->
    <rect x="2" y="2" width="1196" height="316" fill="url(#bg-grad)" />
    <rect x="2" y="2" width="1196" height="316" fill="url(#warm-glow)" />
    <rect x="2" y="2" width="1196" height="316" fill="url(#corner-shadow)" />

    <!-- Fine editorial grid -->
    <rect x="2" y="2" width="1196" height="316" fill="url(#editorial-grid)" />

    <!-- Subtle decorative geometric curves on the right -->
    <circle cx="1090" cy="160" r="240" fill="none" stroke="#F5EFE6" stroke-opacity="0.06" stroke-width="1" />
    <circle cx="1090" cy="160" r="175" fill="none" stroke="#E6C3AD" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="4 6" />
    <circle cx="1090" cy="160" r="110" fill="none" stroke="#F5EFE6" stroke-opacity="0.05" stroke-width="1" />
    <line x1="920" y1="0" x2="920" y2="320" stroke="#F5EFE6" stroke-opacity="0.06" stroke-width="1" />

    <!-- Top editorial header bar -->
    <g transform="translate(72, 46)">
      <!-- Terminal prompt pill -->
      <rect x="0" y="0" width="154" height="28" rx="6" ry="6" fill="#1C1411" fill-opacity="0.55" stroke="#E6C3AD" stroke-opacity="0.28" stroke-width="1" />
      <circle cx="15" cy="14" r="3.5" fill="#D47A53" />
      <text x="28" y="18.5" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" font-weight="600" fill="#F2DEC9" letter-spacing="0.6">
        &gt; sudo whoami
      </text>
    </g>

    <!-- Top-right editorial issue stamp -->
    <text x="1128" y="64" text-anchor="end" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace" font-size="11.5" fill="#E6C3AD" fill-opacity="0.65" letter-spacing="2.5">
      IAM // AI // 30.4383° N
    </text>

    <!-- Main Name in Bold Serif -->
    <text x="72" y="166" font-family="Georgia, 'Playfair Display', 'Times New Roman', Times, serif" font-size="72" font-weight="700" fill="#FAF5EE" letter-spacing="-0.8">
      Adrian Williams
    </text>

    <!-- Editorial Accent Rule -->
    <rect x="74" y="192" width="520" height="1.5" fill="url(#rule-grad)" />
    <rect x="74" y="191.5" width="44" height="2.5" fill="#E29578" />

    <!-- Subtitle -->
    <text x="74" y="232" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#EFE3D5" letter-spacing="1.2">
      Identity &amp; Access <tspan fill="#D98A63" font-weight="600">·</tspan> AI builder <tspan fill="#D98A63" font-weight="600">·</tspan> Tallahassee, FL
    </text>

    <!-- Bottom editorial micro-caption -->
    <text x="74" y="276" font-family="ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace" font-size="12" fill="#C9B3A3" fill-opacity="0.72" letter-spacing="1.4">
      ENTRA ID  /  ZERO TRUST  /  AGENTIC WORKFLOWS  /  LOCAL AI
    </text>

    <!-- Bottom-right registration mark -->
    <g transform="translate(1108, 266)" opacity="0.45">
      <line x1="0" y1="6" x2="20" y2="6" stroke="#FAF5EE" stroke-width="1" />
      <line x1="10" y1="-4" x2="10" y2="16" stroke="#FAF5EE" stroke-width="1" />
      <circle cx="10" cy="6" r="5" fill="none" stroke="#FAF5EE" stroke-width="1" />
    </g>
  </g>

  <!-- Crisp border frame for both light and dark GitHub backgrounds -->
  <rect x="2" y="2" width="1196" height="316" rx="14" ry="14" fill="none" stroke="url(#border-grad)" stroke-width="2" />
</svg>
